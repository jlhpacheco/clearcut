[project]
name = "clearcut_agent"
version = "0.1.0"
description = "ClearCut private Google ADK agent service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "google-adk==2.8.0",
    "google-genai==2.22.0"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
    "."
]
